# Runs on every `v*` tag. Secrets required (Settings → Secrets → Actions):
#   APT_GPG_PRIVATE_KEY  armored private key from scripts/apt-keygen.sh
#   APT_GPG_PASSPHRASE   its passphrase
#   APT_GPG_KEY_ID       its fingerprint / key id
name: release
on:
  push:
    tags: ["v*"]
  # Re-run only the apt publishing step for an existing release:
  #   gh workflow run release.yml -f tag=v0.3.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish to the apt repository"
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the .deb files as a signed apt repository on the gh-pages branch
  # (served at https://jinhyo-dev.github.io/gitpad/apt).
  apt:
    needs: goreleaser
    if: always() && (needs.goreleaser.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download .deb packages from the release
        run: gh release download "${RELEASE_TAG}" --pattern '*.deb' --dir debs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Import signing key
        run: |
          echo "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      - name: Check out gh-pages (or start it)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          else
            mkdir pages && cd pages && git init -b gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            touch .nojekyll
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build apt repository
        run: scripts/apt-repo.sh pages/apt debs
        env:
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      - name: Publish
        run: |
          cd pages
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt: ${RELEASE_TAG}" || echo "nothing to publish"
          git push origin gh-pages
